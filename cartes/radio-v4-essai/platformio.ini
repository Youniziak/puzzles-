; Programme d'essai de la carte radio RADIONÉO v4 (plan de test, étape 6).
; Compiler :           pio run -d cartes/radio-v4-essai
; Charger sur la carte : pio run -d cartes/radio-v4-essai -t upload
; Écouter ses annonces : pio device monitor -d cartes/radio-v4-essai
; Versions figées le 23/10/2026 : plateforme espressif32 6.4.0 (cœur Arduino 2.0.x : la bibliothèque PU2CLR SI4735
; n'est pas donnée pour le cœur 3), bibliothèque PU2CLR SI4735 2.1.8 (licence MIT).

[env:radio-v4]
platform = espressif32@6.4.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    pu2clr/PU2CLR SI4735@2.1.8
